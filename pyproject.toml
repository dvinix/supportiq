[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supportiq"
version = "0.1.0"
description = "Production-grade LLM fine-tuning system for customer support triage with strict JSON schema outputs."
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
    { name = "SupportIQ Team" },
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
]
data = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.4.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.4",
    "datasketch>=1.6.4",
    "dvc>=3.48.0",
]
train = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "mlflow>=2.12.0",
]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
]
data = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.4.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.4",
    "datasketch>=1.6.4",
    "dvc>=3.48.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
]
train = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "mlflow>=2.12.0",
]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supportiq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers -v"
