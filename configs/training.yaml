model:
  name: "Qwen/Qwen3-4B-Base"
  dev_model_name: "Qwen/Qwen3-0.6B-Base" # For cheap iteration & smoke tests (or Qwen/Qwen3-1.7B-Base)
  revision: "main"
  torch_dtype: "float16" # Switch to "bfloat16" for SageMaker ml.g5.xlarge (A10G)

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

training:
  seed: 42
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 100
  evaluation_strategy: "steps"
  eval_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  output_dir: "checkpoints"
  max_seq_length: 512
